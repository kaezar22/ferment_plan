name: Check fermentation alerts

on:
  schedule:
    # Corre cada hora, al minuto 0 (hora UTC). Ajusta el cron si quieres
    # otra frecuencia, ej. "*/30 * * * *" para cada 30 minutos.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # permite dispararlo manualmente desde la pestaña Actions

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/check_alerts.py
